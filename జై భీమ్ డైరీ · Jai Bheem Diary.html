function mv(x){cm+=x;if(cm<0){cm=11;cy--}if(cm>11){cm=0;cy++}if(cy<2026){cy=2026;cm=0}if(cy>2042){cy=2042;cm=11}R()}
V.diary=function(){var e=ent(cur),hh=hols(cur).map(function(x){return'<span class="tag">🎉 '+esc(L([x.te,x.en]))+'</span>'}).join(''),dn=new Date(cur+'T00:00:00'),ms=['😊','😐','😔','😡','🤩'].map(function(m){return'<option'+(e.mood==m?' selected':'')+'>'+m+'</option>'}).join('');
return'<h2>'+t('diary')+'</h2><div class="row"><button class="b b2" onclick="sh(-1)">◀</button><b style="text-align:center">'+cur+' · '+L(DN[dn.getDay()])+'</b><button class="b b2" onclick="sh(1)">▶</button></div><div>'+hh+(dn.getDay()==0?'<span class="tag">☀️ ఆదివారం / Sunday</span>':'')+'</div>'+
'<label>'+t('ttl')+'</label><input value="'+esc(e.title)+'" oninput="setf(\'title\',this.value)"><label>'+t('det')+'</label><textarea oninput="setf(\'text\',this.value)">'+esc(e.text)+'</textarea>'+
'<div class="row"><div><label>'+t('mood')+'</label><select onchange="setf(\'mood\',this.value)">'+ms+'</select></div><div><label>'+t('pri')+'</label><select onchange="setf(\'pri\',this.value)">'+['low','normal','high'].map(function(x){return'<option'+(e.pri==x?' selected':'')+'>'+x+'</option>'}).join('')+'</select></div></div>'+
'<label>'+t('tags')+'</label><input value="'+esc(e.tags)+'" oninput="setf(\'tags\',this.value)"><label>'+t('fu')+'</label><input type="date" value="'+esc(e.fu)+'" onchange="setf(\'fu\',this.value)">'+
'<h3>'+t('tasks')+'</h3>'+e.tasks.map(function(q,i){return'<div class="ck"><input type="checkbox"'+(q.d?' checked':'')+' onchange="tk('+i+')"><span class="'+(q.d?'dn':'')+'" style="flex:1">'+esc(q.t)+'</span><button class="b b2" onclick="tr('+i+')">✕</button></div>'}).join('')+'<div class="row"><input id="nt"><button class="b" style="flex:0" onclick="ta()">'+t('add')+'</button></div>'+
'<label>'+t('priv')+'</label><textarea style="min-height:60px" oninput="setf(\'priv\',this.value)">'+esc(e.priv)+'</textarea><p class="mu">'+t('saved')+'</p><button class="b bd" onclick="if(confirm(t(\'cd\'))){delete S.diary[cur];save();R()}">'+t('del')+'</button>'};
function sh(x){var d=new Date(cur+'T00:00:00');d.setDate(d.getDate()+x);cur=ds(d);R()}
function ta(){var i=document.getElementById('nt');if(i.value.trim()){ent(cur).tasks.push({t:i.value.trim(),d:0});save();R()}}
function tk(i){var q=ent(cur).tasks[i];q.d=q.d?0:1;save();R()}function tr(i){ent(cur).tasks.splice(i,1);save();R()}
V.leave=function(){var y=new Date().getFullYear(),us={},hy=y,i,hs=[];LT.forEach(function(x){us[x[0]]=0});
S.leaves.forEach(function(l){if(l.d.slice(0,4)==y)us[l.t]++});
for(i=0;i<366;i++){var d=new Date(y,0,1+i);if(d.getFullYear()!=y)break;hols(ds(d)).forEach(function(x){hs.push(ds(d).slice(5)+' – '+esc(L([x.te,x.en])))})}
S.hol.forEach(function(h){});
return'<h2>'+t('leave')+'</h2><div class="card"><b>'+t('bal')+'</b><div class="bal">'+LT.map(function(x){return'<div><b>'+(S.bal[x[0]]-us[x[0]])+'</b>'+x[0]+'<div class="mu">/ <input style="width:46px;padding:2px" type="number" value="'+S.bal[x[0]]+'" onchange="S.bal[\''+x[0]+'\']=+this.value;save();R()"></div></div>'}).join('')+'</div><p class="mu">'+t('ref')+'</p></div>'+
'<div class="card"><b>'+t('log')+'</b><div class="row"><input id="ld" type="date" value="'+ds(new Date())+'"><select id="lt">'+LT.map(function(x){return'<option value="'+x[0]+'">'+L([x[1],x[2]])+'</option>'}).join('')+'</select></div><button class="b" onclick="S.leaves.push({d:document.getElementById(\'ld\').value,t:document.getElementById(\'lt\').value});save();R()">'+t('add')+'</button>'+
S.leaves.slice().sort(function(a,b){return a.d<b.d?1:-1}).map(function(l){return'<div class="row"><span>'+l.d+' · '+l.t+'</span><button class="b b2" style="flex:0" onclick="S.leaves.splice(S.leaves.findIndex(function(z){return z.d==\''+l.d+'\'&&z.t==\''+l.t+'\'}),1);save();R()">✕</button></div>'}).join('')+'</div>'+
'<div class="card"><b>'+t('hol')+' '+y+'</b>'+hs.map(function(s){return'<div>🎉 '+s+'</div>'}).join('')+'<p class="mu">'+(S.lang=='te'?'తిథి ఆధారిత పండుగలు (ఉగాది, దసరా, దీపావళి, బతుకమ్మ మొదలైనవి) ప్రతి సంవత్సరం మారతాయి. అధికారిక జాబితా ప్రకారం కింద మీరే జోడించండి.':'Lunar-calendar festivals (Ugadi, Dasara, Diwali, Bathukamma etc.) change yearly. Add them below from the official list.')+'</p></div>'+
'<div class="card"><b>'+t('addh')+'</b><input id="hd" type="date"><input id="hn" placeholder="'+t('name')+'"><button class="b" onclick="var d=hd.value,n=hn.value.trim();if(d&&n){S.hol.push({d:d,n:n});save();R()}">'+t('add')+'</button>'+S.hol.map(function(h,i){return'<div class="row"><span>'+h.d+' · '+esc(h.n)+'</span><button class="b b2" style="flex:0" onclick="S.hol.splice('+i+',1);save();R()">✕</button></div>'}).join('')+'</div>'};
V.rules=function(){return'<h2>'+t('rules')+' · NPDCL / Telangana</h2><p class="mu">'+t('ref')+'</p>'+RULES.map(function(r){return'<div class="card"><b>'+L([r[0],r[1]])+'</b><div>'+L([r[2],r[3]])+'</div></div>'}).join('')};
V.set=function(){return'<h2>'+t('set')+'</h2><div class="card"><label>'+t('lang')+'</label><select onchange="S.lang=this.value;save();R()"><option value="te"'+(S.lang=='te'?' selected':'')+'>తెలుగు</option><option value="en"'+(S.lang=='en'?' selected':'')+'>English</option></select><label>'+t('theme')+'</label><select onchange="S.theme=this.value;save();R()">'+['auto','light','dark'].map(function(x){return'<option'+(S.theme==x?' selected':'')+'>'+x+'</option>'}).join('')+'</select><label>'+t('fs')+': '+S.fs+'</label><input type="range" min="14" max="24" value="'+S.fs+'" onchange="S.fs=+this.value;save();R()"></div>'+
'<div class="card"><button class="b" onclick="document.getElementById(\'bk\').value=JSON.stringify(S)">'+t('exp')+'</button> <button class="b b2" onclick="try{S=Object.assign(def(),JSON.parse(document.getElementById(\'bk\').value));save();R()}catch(e){alert(\'Invalid\')}">'+t('imp')+'</button><textarea id="bk"></textarea></div>'+
'<div class="card"><button class="b b2" onclick="go(\'cover\')">'+t('cover')+'</button><p class="mu">జై భీమ్ డైరీ · '+t('dev')+'</p></div>'};
function R(){var r=document.documentElement;r.setAttribute('lang',S.lang);if(S.theme=='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);document.body.style.fontSize=S.fs+'px';
document.getElementById('app').innerHTML=V[v]();var n=document.getElementById('nav');
n.style.display=v=='cover'?'none':'flex';
n.innerHTML=[['home','🏠'],['cal','📅'],['diary','✍️'],['leave','🌴'],['rules','📜'],['set','⚙️']].map(function(x){return'<button class="'+(v==x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')"><span>'+x[1]+'</span>'+t(x[0])+'</button>'}).join('')}
R();
</script></body></html>
